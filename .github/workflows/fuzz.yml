name: Fuzz

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: make -C tests fuzz
      - name: Fuzz for 20 minutes
        run: |
          mkdir -p fuzz-corpus artifacts
          tests/build/fuzz -max_total_time=1200 -artifact_prefix=artifacts/ fuzz-corpus tests/corpus
      - name: Minimize the corpus
        if: always()
        run: |
          mkdir fuzz-corpus-min
          tests/build/fuzz -merge=1 fuzz-corpus-min fuzz-corpus tests/corpus
          rm -rf fuzz-corpus
          mv fuzz-corpus-min fuzz-corpus
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: artifacts
